margin:0;

/* ===== FLOAT HEART ===== */

.floatLayer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:0;
}

.heart{
position:absolute;
font-size:22px;
animation:heartUp linear infinite;
}

@keyframes heartUp{
0%{transform:translateY(100vh);opacity:1;}
100%{transform:translateY(-10vh);opacity:0;}
}

/* ===== FIREWORK ===== */

.firework{
position:absolute;
width:6px;
height:6px;
border-radius:50%;
animation:explode 1s ease-out forwards;
}

@keyframes explode{
0%{transform:scale(1);opacity:1;}
100%{transform:scale(15);opacity:0;}
}

/* ===== LOGIN ===== */

#loginBox{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 0 25px rgba(0,0,0,0.2);
text-align:center;
z-index:2;
}

input{
padding:10px;
border-radius:10px;
border:1px solid pink;
}

button{
padding:10px 20px;
border:none;
border-radius:20px;
background:#ff66a3;
color:white;
cursor:pointer;
}

/* ===== THANK AREA ===== */

#thankArea{

text-align:center;
position:relative;
z-index:1;
}

.mainImg{

.textBox{

background:white;
padding:30px;
border-radius:20px;

/* ===== LOGIN FUNCTION ===== */

function checkPass(){

let pass = document.getElementById("password").value.trim();

if(users[pass]){

document.getElementById("loginBox").style.display="none";
document.getElementById("thankArea").style.display="block";

document.getElementById("mainImage").src = users[pass].img;
document.getElementById("thankText").innerText = users[pass].message;

/* bật nhạc */
let music = document.getElementById("bgMusic");
music.play().then(()=>{}).catch(()=>{});

createFloating();
createFireworks();

}else{
alert("Sai mật khẩu rồi nhaaa 🥺");
}
}

/* ENTER để đăng nhập */
document.getElementById("password").addEventListener("keypress",function(e){
if(e.key==="Enter"){
checkPass();
}
});

/* ===== HEART FLOAT ===== */

function createFloating(){

const layer = document.getElementById("floatLayer");
layer.innerHTML = "";

for(let i=0;i<30;i++){
let heart = document.createElement("div");
heart.innerHTML="💗";
heart.className="heart";
heart.style.left=Math.random()*100+"%";
heart.style.animationDuration=(4+Math.random()*6)+"s";
layer.appendChild(heart);
}

}

/* ===== FIREWORK ===== */

function createFireworks(){

for(let i=0;i<35;i++){
let fw=document.createElement("div");
fw.className="firework";
fw.style.left=Math.random()*100+"%";
fw.style.top=Math.random()*60+"%";
fw.style.background=`hsl(${Math.random()*360},100%,60%)`;
document.body.appendChild(fw);

setTimeout(()=>{fw.remove();},1000);
}

}
